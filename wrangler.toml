name = "whoami-aauth-dev"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Opt in to the account-level Workers Trace Events Logpush job (forensic
# archive: R2 bucket cloudflare-managed-3941311c, WEUR). Per-worker opt-in
# is required — without this the account job ignores the worker.
logpush = true

[assets]
directory = "public"

[vars]
ORIGIN = "https://whoami.aauth.dev"

[[routes]]
pattern = "whoami.aauth.dev"
custom_domain = true

[[queues.producers]]
queue = "aauth-events"
binding = "EVENTS_QUEUE"
